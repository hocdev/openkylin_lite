name: openKylin Lite
on:
  push:
    branches: [main, codex/ukui-password]
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect first; build after reviewing config/remove-packages.txt
        type: choice
        options: [inspect, profile, build]
        default: inspect
      sha256:
        description: Trusted SHA256 of the original ISO (required for build)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: openkylin-lite
  cancel-in-progress: true
jobs:
  cleanup-superseded-runs:
    if: ${{ !cancelled() && github.event_name == 'push' }}
    needs: [verify-sources, remaster]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete old cancelled or skipped push runs
        shell: bash
        run: |
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/lite.yml/runs"
          for conclusion in cancelled skipped; do
            ids=$(gh api --paginate "$runs?branch=main&event=push&status=$conclusion&per_page=100" \
              | jq -r --argjson current "$GITHUB_RUN_NUMBER" \
                '.workflow_runs[] | select(.status == "completed" and .run_number < $current) | .id')
            while IFS= read -r id; do
              [[ -n "$id" ]] || continue
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id"
              echo "Deleted $conclusion push run $id"
            done <<< "$ids"
          done
  verify-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Verify exact Gitee source commits
        run: python3 scripts/verify_source_locks.py
      - name: Save source compatibility report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: source-verification-${{ github.run_id }}
          path: reports/source-tag-verification.json
          retention-days: 3
          if-no-files-found: warn
  remaster:
    needs: [ukui-password-candidates, installer-candidate, control-center-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: write
    env:
      MODE: ${{ inputs.mode || 'build' }}
      # Pinned to the original ISO observed in the successful inspection.
      # This is an integrity pin, not an upstream signature verification.
      SOURCE_SHA256: ${{ inputs.sha256 || '4bc4389d15c8af8da7882c16871edcb43650d534ee56deeda8991ea1492652ce' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - name: Download password-only UKUI packages
        uses: actions/download-artifact@v6
        with:
          pattern: ukui-*-password-candidate
          path: ukui-candidates
          merge-multiple: true
      - name: Download 30GB-limit installer package
        uses: actions/download-artifact@v6
        with:
          name: kylin-os-installer-candidate
          path: ukui-candidates
      - name: Download responsive About control center package
        uses: actions/download-artifact@v6
        with:
          name: ukui-control-center-candidate
          path: ukui-candidates
      - name: Set UKUI candidate package directory
        run: echo "UKUI_DEB_DIR=$GITHUB_WORKSPACE/ukui-candidates" >> "$GITHUB_ENV"
      - name: Set original ISO location
        run: echo "ISO_SOURCE_DIR=$RUNNER_TEMP/openkylin-source" >> "$GITHUB_ENV"
      - name: Install ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso squashfs-tools shellcheck aria2 ostree
          shellcheck scripts/*.sh
          python3 -m unittest discover -s tests -v
      - name: Restore original ISO cache
        id: iso-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.ISO_SOURCE_DIR }}/source.iso
          key: openkylin-source-v1-${{ env.SOURCE_SHA256 }}
      - name: Prepare and verify original ISO
        run: bash scripts/prepare_source.sh
      - name: Save verified original ISO before remastering
        if: steps.iso-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.ISO_SOURCE_DIR }}/source.iso
          key: openkylin-source-v1-${{ env.SOURCE_SHA256 }}
      - name: Inspect or remaster
        run: sudo --preserve-env=MODE,SOURCE_SHA256,ISO_SOURCE_DIR,RUNNER_TEMP,GITHUB_WORKSPACE,GITHUB_STEP_SUMMARY,UKUI_DEB_DIR bash scripts/remaster.sh
      - name: Save small inspection reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: inspection-${{ github.run_id }}
          path: reports/
          retention-days: 3
          if-no-files-found: warn
      - name: Save ISO to a draft release
        if: env.MODE == 'build'
        env:
          RELEASE_TAG: lite-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          bash scripts/publish.sh
      - name: Clean pending ISO after cancellation or failure
        if: always()
        run: |
          if [[ -f output/iso-path.txt ]]; then
            iso=$(cat output/iso-path.txt)
            work=$(dirname "$iso")
            if [[ "$work" == "$RUNNER_TEMP"/openkylin.* && "$iso" == "$work/lite.iso" ]]; then
              sudo rm -rf -- "$work"
            fi
          fi

  ukui-password-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container: openkylin/openkylin@sha256:078676bf0d39f0efe0f240d925e10fc11a22e5e2b1dcb163eec4ed511bd17741
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ukui-greeter
            tag: build/4.10.0.0-ok5.5update1
            commit: 9f2be4c16f0453820c898f41d0d67d1df48f6bd2
          - package: ukui-screensaver
            tag: build/4.20.0.0-ok5.7
            commit: ac1a511b62b172d88f0d83e1e2074fef62178376
          - package: ukui-polkit
            source: ukui-biometric-auth
            tag: build/4.20.0.0-ok2.11update2
            commit: d8dfb162c39e651bbf8104c3ce363042c3cc860b
    steps:
      - uses: actions/checkout@v6
      - name: Build password-only UKUI package
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
          SOURCE_PACKAGE: ${{ matrix.source || matrix.package }}
          SOURCE_TAG: ${{ matrix.tag }}
          SOURCE_COMMIT: ${{ matrix.commit }}
        run: bash scripts/build_ukui_password.sh
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.package }}-password-candidate
          path: ukui-output/
          if-no-files-found: error
          retention-days: 7

  control-center-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: openkylin/openkylin@sha256:078676bf0d39f0efe0f240d925e10fc11a22e5e2b1dcb163eec4ed511bd17741
    steps:
      - uses: actions/checkout@v6
      - name: Build control center with nonblocking About queries
        shell: bash
        run: bash scripts/build_control_center_candidate.sh
      - uses: actions/upload-artifact@v6
        with:
          name: ukui-control-center-candidate
          path: control-center-output/
          if-no-files-found: error
          retention-days: 7

  installer-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container: openkylin/openkylin@sha256:078676bf0d39f0efe0f240d925e10fc11a22e5e2b1dcb163eec4ed511bd17741
    steps:
      - uses: actions/checkout@v6
      - name: Build 30GB-limit kylin-os-installer package
        shell: bash
        env:
          PACKAGE: kylin-os-installer
          SOURCE_TAG: build/0.2.2-0k1.16
          SOURCE_COMMIT: 15008beb5f39ccf33f920e03e6bcef24c2826b22
          SOURCE_TARBALL_URL: http://archive.build.openkylin.top/openkylin/pool/main/k/kylin-os-installer/kylin-os-installer_0.2.2-0k1.16.tar.xz
          SOURCE_TARBALL_SHA256: 189349021171f31d19539d41bed9955288104427ce35474beddb0a42cbac0042
        run: bash scripts/build_installer_candidate.sh
      - uses: actions/upload-artifact@v6
        with:
          name: kylin-os-installer-candidate
          path: installer-output/
          if-no-files-found: error
          retention-days: 7
