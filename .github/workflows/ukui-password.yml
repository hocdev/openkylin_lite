name: UKUI password-only package candidates
on:
  push:
    branches: [codex/ukui-password]
    paths:
      - '.github/workflows/ukui-password.yml'
      - 'patches/ukui-password/**'
      - 'scripts/build_ukui_password.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ukui-password-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container: openkylin/openkylin@sha256:078676bf0d39f0efe0f240d925e10fc11a22e5e2b1dcb163eec4ed511bd17741
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ukui-greeter
            tag: build/4.10.0.0-ok5.5update1
            commit: 9f2be4c16f0453820c898f41d0d67d1df48f6bd2
          - package: ukui-screensaver
            tag: build/4.20.0.0-ok5.7
            commit: ac1a511b62b172d88f0d83e1e2074fef62178376
    steps:
      - uses: actions/checkout@v6
      - name: Build package in openKylin 3.0
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
          SOURCE_TAG: ${{ matrix.tag }}
          SOURCE_COMMIT: ${{ matrix.commit }}
        run: bash scripts/build_ukui_password.sh
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.package }}-password-candidate
          path: ukui-output/
          if-no-files-found: error
          retention-days: 7
